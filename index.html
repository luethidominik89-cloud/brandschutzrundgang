<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E77">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Brandschutz-Rundgang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- Brandschutz-Rundgang · DETEC Facility Services · © Dominik Lüthi, Einzelfirma prüfbuch.ch -->
<style>
/* Gleiche Formensprache wie Sicherheitsregister und Zählerprüfung:
   Kopfleiste mit Speicher-Anzeige, Kacheln als Filter, Tab-Leiste unten, eine Spalte */
:root{
  --ground:#E9EDEE; --surface:#FFFFFF; --surface-2:#F3F6F6;
  --ink:#0F1618; --ink-2:#48595D; --ink-3:#78898D;
  --line:#D2DADB; --line-strong:#B4C0C2;
  --accent:#0B6E77; --accent-ink:#FFFFFF; --accent-soft:#DCEDEE;
  --ok:#2C7A52; --ok-soft:#DCEDE3; --warn:#9C6B00; --warn-soft:#F7EBCE; --crit:#B3122C; --crit-soft:#F8DCE1;
  --tape:#F2C230; --tape-ink:#1B211F; --status-ink:#FFFFFF;
  --rot:var(--crit); --gelb:#C45F00; --gruen:var(--ok);
  --shadow:0 1px 2px rgba(15,22,24,.08),0 6px 18px rgba(15,22,24,.06);
  --r:6px;
  --f-ui:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-disp:Archivo,"Arial Narrow",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1315; --surface:#161F21; --surface-2:#1D282B; --ink:#E6EDEC; --ink-2:#A2B2B4; --ink-3:#76888B;
  --line:#263336; --line-strong:#3A4A4D; --accent:#37A8B2; --accent-ink:#06181A; --accent-soft:#123338;
  --ok:#5FB587; --ok-soft:#122C20; --warn:#E3B24E; --warn-soft:#2E2413; --crit:#F2748A; --crit-soft:#33161C;
  --tape:#E6B927; --status-ink:#0D1315; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D1315; --surface:#161F21; --surface-2:#1D282B; --ink:#E6EDEC; --ink-2:#A2B2B4; --ink-3:#76888B;
  --line:#263336; --line-strong:#3A4A4D; --accent:#37A8B2; --accent-ink:#06181A; --accent-soft:#123338;
  --ok:#5FB587; --ok-soft:#122C20; --warn:#E3B24E; --warn-soft:#2E2413; --crit:#F2748A; --crit-soft:#33161C;
  --tape:#E6B927; --status-ink:#0D1315; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--f-ui);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopfleiste */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;min-height:58px}
.topbar .back{background:none;border:0;min-width:44px;min-height:44px;font-size:30px;line-height:1;color:var(--accent);cursor:pointer;padding:0 4px;margin-left:-6px}
.mark{width:32px;height:32px;border-radius:4px;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .78rem var(--f-disp)}
.mark.haslogo{background:transparent;width:auto;max-width:90px}
.mark.haslogo img{height:30px;width:auto;display:block}
.tt{min-width:0;flex:1}
.topbar h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.topbar .sub{font-size:.74rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.synckn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);font:600 .76rem var(--f-ui);white-space:nowrap;flex:none}
.synckn .punkt{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.synckn.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}.synckn.ok .punkt{background:var(--ok)}
.synckn.laeuft .punkt{background:var(--accent);animation:puls 1s ease-in-out infinite}
.synckn.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}.synckn.crit .punkt{background:var(--crit)}
@keyframes puls{50%{opacity:.25}}
#upd{position:sticky;top:0;z-index:49;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600}
#upd span{flex:1}
#upd button{min-height:44px;border:0;border-radius:var(--r);background:var(--accent-ink);color:var(--accent);font:700 .95rem var(--f-disp);padding:0 14px;cursor:pointer}
.gross-aktion.zwei{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.gross-aktion.zwei svg{color:var(--accent)}
em.art{font-style:normal;font:700 .62rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);border-radius:4px;padding:1px 6px;margin-right:6px}
em.art.neu{background:var(--accent-soft);color:var(--accent)}
.card.nkopf{flex-direction:row;align-items:center}.nkopf .btn{flex:none}.nkopf div{flex:1;min-width:0}.nkopf b{display:block;font-size:1.05rem}.nkopf span{font-size:.82rem;color:var(--ink-3)}
.frow{display:flex;flex-direction:column;gap:5px}
.flab{display:flex;align-items:center;gap:8px;font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.flab span{flex:1}.flab .ib{width:34px;height:34px;font-size:1rem}
.selx{display:flex;flex-direction:column;gap:6px}
.fgrow,.lvrow{display:flex;gap:8px;align-items:center;margin:6px 0}.fgrow select{flex:1 1 auto;min-width:0}.fgrow select.n{flex:0 0 74px}.fgrow input{flex:0 0 96px;min-width:0}.fgrow .x{flex:0 0 48px;min-height:48px;padding:0}.lvrow{flex-wrap:wrap}.lvrow b{flex:0 0 100%;font-size:13px;color:var(--mut,#5b6b70)}.lvrow select{flex:1 1 200px;min-width:0}.lvrow input{flex:0 0 110px}
.seg.nseg.s2{grid-template-columns:1fr 1fr}.seg.nseg.s4{grid-template-columns:repeat(4,1fr)}
.seg.nseg button{font-size:.82rem;line-height:1.15;padding:4px}
.svgbox{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}.svgbox svg{width:100%;height:auto;display:block}
table.kz{width:100%;border-collapse:collapse;font-size:.88rem}table.kz td{padding:5px 2px;border-bottom:1px solid var(--line)}table.kz td:last-child{text-align:right;font-family:var(--f-mono);font-weight:600}
.skthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.skthumbs:empty{display:none}
.skth{border:1px solid var(--line-strong);border-radius:var(--r);background:#fff;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;font-size:.75rem;color:var(--ink-2)}
.skth img{width:100%;aspect-ratio:1/1.414;object-fit:contain;background:#fff}
.skbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.skbar.sk2{grid-template-columns:repeat(8,1fr)}
.skbar button{min-height:48px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.skbar button b{font-size:1.2rem;line-height:1}.skbar button span{font-size:.6rem;font-weight:600;color:var(--ink-3)}
.skbar button.on{background:var(--accent-soft);border-color:var(--accent)}
.skbar .col i{width:24px;height:24px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
.skbar .wd i{width:24px;background:var(--ink);border-radius:4px;display:block}
.skwrap{display:flex;justify-content:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:4px}
#skc{touch-action:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);display:block}
.sktext{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:6px;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:6px}
.sktext input{flex:1;min-width:0}.sktext .btn{min-height:48px}
#err{position:sticky;top:0;z-index:50;background:var(--crit);color:var(--status-ink);font-weight:600;padding:12px 14px;font-size:.95rem}

main{padding:12px 12px 110px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Tab-Leiste */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 2px 9px;cursor:pointer;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;
  font:600 .64rem var(--f-disp);letter-spacing:.04em;text-transform:uppercase;min-height:60px;border-top:2px solid transparent;margin-top:-1px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tabbar button.plus{color:var(--status-ink);background:var(--crit);border-radius:14px;margin:6px 6px 4px;min-height:52px;border-top:0}
.tabbar button.plus svg{stroke-width:2.6}

/* Karten, Felder, Knöpfe */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.tight{padding:10px 12px;gap:8px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card h2,.eyebrow{font:600 .7rem var(--f-disp);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0}
label.f{display:flex;flex-direction:column;gap:5px;font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=search],select,textarea{width:100%;min-height:50px;border:1px solid var(--line-strong);
  border-radius:var(--r);padding:10px 12px;background:var(--surface);font:400 1rem var(--f-ui);color:var(--ink);text-transform:none;letter-spacing:0}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{min-height:50px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 .92rem var(--f-disp);
  padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:60px;font-size:1.02rem;width:100%}
.btn.warn{border-color:var(--crit);color:var(--crit)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:.85rem;color:var(--ink-2)}
.hint{font-size:.85rem;color:var(--ink-3);margin:0}
.banner{padding:10px 12px;border-radius:var(--r);font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.92rem}

/* Grosse Aktion (Startseite) */
.gross-aktion{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);
  border:0;border-radius:8px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.gross-aktion svg{width:38px;height:38px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gross-aktion b{display:block;font:700 1.18rem var(--f-disp)}
.gross-aktion small{display:block;font-size:.88rem;opacity:.85;margin-top:2px}

/* Kacheln */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);
  padding:9px 8px;text-align:left;cursor:pointer;width:100%;min-height:68px}
.stat .n{display:block;font:700 1.7rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat .l{display:block;font-size:.68rem;color:var(--ink-2);margin-top:5px;line-height:1.2;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat.rot{border-top-color:var(--rot)}.stat.rot .n{color:var(--crit)}
.stat.gelb{border-top-color:var(--gelb)}.stat.gelb .n{color:var(--gelb)}
.stat.gruen{border-top-color:var(--gruen)}.stat.gruen .n{color:var(--ok)}
.stat.z{border-top-color:var(--accent)}
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress .zahl{font:500 .8rem var(--f-mono);color:var(--ink-2);white-space:nowrap}

/* Chips und Ampel */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:46px;padding:8px 13px;border-radius:24px;border:1px solid var(--line-strong);background:var(--surface);font-size:.95rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.amps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amp{min-height:74px;border-radius:8px;border:2px solid transparent;font:700 1.1rem var(--f-disp);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:6px}
.amp small{font:600 .72rem var(--f-ui);margin-top:4px}
.amp.rot{background:var(--crit-soft);color:var(--crit)} .amp.rot.on{background:var(--rot);color:#fff;border-color:var(--ink)}
.amp.gelb{background:#FDE9DA;color:#8A3F00} .amp.gelb.on{background:var(--gelb);color:#fff;border-color:var(--ink)}
.amp.gruen{background:var(--ok-soft);color:var(--ok)} .amp.gruen.on{background:var(--gruen);color:#fff;border-color:var(--ink)}
.amps.missing .amp{border-color:var(--crit);border-style:dashed}
.stepper{display:grid;grid-template-columns:50px 1fr 50px;gap:6px;align-items:center}
.stepper button{min-height:50px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper input{text-align:center;font-family:var(--f-mono)}

/* Listen wie im Sicherheitsregister */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;
  width:100%;text-align:left;min-height:62px;color:inherit}
.list>:last-child,.list>:last-child .item{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font-size:.8rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.zrow .item{border-bottom:0}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dot{min-width:28px;height:28px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font:700 .85rem var(--f-disp);padding:0 6px}
.dot.rot{background:var(--rot);color:#fff}.dot.gelb{background:var(--gelb);color:#fff}.dot.gruen{background:var(--gruen);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 .68rem var(--f-disp);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.offen{background:var(--surface-2);color:var(--ink-2)}.pill.io{background:var(--ok-soft);color:var(--ok)}.pill.gp{background:var(--accent-soft);color:var(--accent)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.qio{min-width:74px;border:0;border-left:1px solid var(--line);background:var(--ok-soft);color:var(--ok);font:700 .9rem var(--f-disp);cursor:pointer}
.qio.del{background:var(--crit-soft,#FBE7EA);color:var(--crit)}
.loeschfrage{border:2px solid var(--crit)}.loeschfrage h2{color:var(--crit)}.loeschfrage .row{margin-top:10px}
.btn.krit{background:var(--crit);border-color:var(--crit);color:#fff}
.mg{box-shadow:inset 6px 0 0 var(--line-strong)}
.mg.rot{box-shadow:inset 6px 0 0 var(--rot)}.mg.gelb{box-shadow:inset 6px 0 0 var(--gelb)}.mg.gruen{box-shadow:inset 6px 0 0 var(--gruen)}
.mg img{width:52px;height:52px;object-fit:cover;border-radius:4px;flex:none;border:1px solid var(--line)}
.nr{font-family:var(--f-mono);font-weight:600;color:var(--accent);margin-right:6px}
.lb{font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 11px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px!important}
.check{border-bottom:1px solid var(--line);padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.check:last-child{border-bottom:0}
.check.hatm{box-shadow:inset 4px 0 0 var(--crit)}
.check .q{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:8px}
.check .lt{flex:1;min-width:0}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);font-size:1.1rem;cursor:pointer}
.hp{font-size:.88rem;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;line-height:1.45}
.check .code{font:600 .72rem var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2);margin-top:2px}
details.info{margin-left:auto}
details.info summary{list-style:none;cursor:pointer;color:var(--accent);font-size:1.15rem;min-width:36px;min-height:32px;text-align:center}
details.info summary::-webkit-details-marker{display:none}
details.info p{font-weight:400;font-size:.88rem;color:var(--ink-2);margin:4px 0 0;flex-basis:100%}
details.info[open]{flex-basis:100%;margin-left:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);min-height:48px;cursor:pointer;font:600 .85rem var(--f-disp);color:var(--ink-2)}
.seg button[data-on="ok"]{background:var(--ok);border-color:var(--ok);color:var(--status-ink)}
.seg button[data-on="mangel"],.seg button[data-on="fehlt"]{background:var(--crit);border-color:var(--crit);color:var(--status-ink)}
.seg button[data-on="nv"],.seg button[data-on="na"]{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
body.gross .seg button{min-height:58px;font-size:.95rem}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line-strong);border-left:5px solid var(--line-strong);background:var(--surface-2);border-radius:6px;padding:7px 10px;min-height:44px;cursor:pointer;font-size:.88rem;text-align:left;color:var(--ink)}
.mchip b{font-family:var(--f-mono)}
.mchip.rot{border-left-color:var(--rot)}.mchip.gelb{border-left-color:var(--gelb)}.mchip.gruen{border-left-color:var(--gruen)}
.check textarea{min-height:60px}
.kl{display:flex;flex-direction:column;gap:4px}
.kl input{font:700 1.5rem var(--f-mono);text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quick .chip{border-radius:var(--r);text-align:left;line-height:1.2;padding:8px 10px;font-size:.9rem}
body.gross .quick .chip{font-size:.95rem;padding:8px 10px}
.filterchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filterchips .chip{flex:none}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photos:empty{display:none}
.ph{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--surface-2);max-width:100%;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;cursor:pointer}

/* Speicherleiste im Mangel */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.bar .btn{flex:1;min-height:56px;font-size:1rem}
.sig{width:100%;height:170px;border:1px dashed var(--line-strong);border-radius:var(--r);background:#fff;touch-action:none;display:block}

/* Sicherungsstatus */
.bk{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:9px 12px}
.bk.ok{background:var(--ok-soft);color:var(--ok)}
.bk div{flex:1;min-width:0}.bk b{display:block;font-size:.9rem}.bk span{font-size:.78rem;opacity:.9}
.bk .btn{min-height:44px;flex:none;background:var(--surface)}

/* Hilfe wie im Sicherheitsregister */
.help{background:var(--accent-soft)}
.help p{margin:0;font-size:.92rem}
.mess{display:flex;flex-direction:column;gap:8px}
details.hilfe{border-bottom:1px solid var(--line)}
details.hilfe:last-child{border-bottom:0}
details.hilfe summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:54px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.hilfe summary::-webkit-details-marker{display:none}
details.hilfe summary::after{content:'+';font-size:1.4rem;color:var(--accent);font-weight:400}
details.hilfe[open] summary::after{content:'−'}
details.hilfe>div{padding:0 16px 14px;color:var(--ink-2);font-size:.95rem;line-height:1.55}
details.hilfe p{margin:0 0 8px}
.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.card>summary{list-style:none;min-height:40px;display:flex;align-items:center;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2::after{content:" +";color:var(--accent);font-size:1rem}
details.card[open]>summary h2::after{content:" −"}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.rptbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center}
#rptview{background:#fff;color:#111}
#rptview .rp{padding:12px}

/* Handschuhmodus */
body.gross{font-size:18px}
body.gross .btn{min-height:58px;font-size:1rem}
body.gross .chip{min-height:54px;font-size:1.02rem;padding:10px 15px}
body.gross .amp{min-height:88px;font-size:1.25rem}
body.gross .item{min-height:74px}
body.gross .stepper{grid-template-columns:60px 1fr 60px}
body.gross .stepper button,body.gross input,body.gross select{min-height:58px}
body.gross .tabbar button{min-height:66px}
body.gross .qio{min-width:86px}

@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body>*:not(#rptview){display:none!important}
  #rptview .rptbar,#rptview .noprint{display:none!important}
  #rptview .rp{padding:0}
}

/* ===== Ergänzungen Brandschutz-Rundgang ===== */
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stat{cursor:pointer;font:inherit;text-align:left}
.gross-aktion{border:0;cursor:pointer;text-align:left}
.gross-aktion.rot{background:var(--crit);color:#fff}
.rghead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.h2b{font:700 1.15rem var(--f-disp);margin:2px 0 0;color:var(--ink);text-transform:none;letter-spacing:0}
.mono{font-family:var(--f-mono);font-weight:600}
.gnr,.snr{min-width:52px;height:44px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:700 1rem var(--f-mono);flex:none;padding:0 6px}
.snr{font-size:.85rem}
.okh{color:var(--ok);font:700 1.3rem var(--f-disp)}
.chev{color:var(--ink-3);font-size:1.4rem}
.tz{display:inline-block;background:var(--crit);color:#fff;border-radius:9px;padding:0 5px;font:700 .7rem var(--f-disp);margin-left:2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.list .item{width:100%;text-align:left;font:inherit;color:inherit}
.gebgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gebk{min-height:72px;border:2px solid var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.gebk b{font:700 1.35rem var(--f-mono)}.gebk small{font-size:.75rem;color:var(--ink-3)}
.gebk.on{background:var(--accent);border-color:var(--accent);color:#fff}.gebk.on small{color:#fff}
.gebk:disabled{opacity:.45}
.katgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.katk{min-height:58px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);font:600 .9rem var(--f-disp);color:var(--ink);cursor:pointer;padding:6px 8px;line-height:1.2}
.katk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pp{display:flex;flex-wrap:wrap;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pp.on{border:2px solid var(--accent);background:var(--accent-soft)}
.pt{flex:1;display:flex;gap:10px;align-items:flex-start;text-align:left;background:none;border:0;padding:12px;font:500 .97rem var(--f-ui);color:var(--ink);cursor:pointer;min-height:52px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;margin-top:1px}
.pp.on .radio{border:7px solid var(--accent)}
.pp details.info{padding:8px 8px 0}.pp details.info[open]{padding:0 12px 10px}
.ref{font:500 .78rem var(--f-mono)!important;color:var(--accent)!important}
.mg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 16px;display:flex;flex-direction:column;gap:8px}
.mg.ueber{border-color:var(--crit)}
.mgk{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mgb{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mgb .t{flex:1;min-width:0}.mgb .t b{display:block;font-weight:600;font-size:.98rem;line-height:1.3}
.mgb .t span{display:block;font-size:.82rem;color:var(--ink-3);margin-top:2px}.mgb .t .bem{color:var(--ink-2);font-style:italic}
.ph.mini{width:64px;height:64px;flex:none;aspect-ratio:auto}.ph.leer{background:var(--surface-2)}
.ph.leer img{display:none}
.mg img{width:100%;height:100%}
.pill.rot{background:var(--crit-soft);color:var(--crit)}.pill.gelb{background:var(--warn-soft);color:var(--gelb)}.pill.gruen{background:var(--ok-soft);color:var(--ok)}.pill.ueb{background:var(--crit);color:#fff}
.seg.s2{grid-template-columns:1fr 1fr}.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg button[data-on="warn"]{background:var(--gelb);border-color:var(--gelb);color:#fff}
.sect{font:600 .72rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:6px 2px -4px}
.banner.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.dl{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:0;font-size:.92rem}.dl dt{color:var(--ink-3)}.dl dd{margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}.steps .btn{margin-top:6px}
.adr{display:block;font:500 .8rem var(--f-mono);color:var(--ink-2);word-break:break-all;margin-top:4px}
.gl{margin:0;padding-left:18px;font-size:.86rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.ctr{text-align:center}
label.check{flex-direction:row;align-items:center;gap:10px;border:0;padding:6px 0;font-size:.95rem}
label.check input{width:24px;height:24px;flex:none}
#busy{position:fixed;inset:0;background:rgba(15,22,24,.6);display:flex;align-items:center;justify-content:center;z-index:60}
#busy div{background:var(--surface);padding:22px 26px;border-radius:10px;font:600 1rem var(--f-disp);display:flex;gap:12px;align-items:center}
#busy i{width:22px;height:22px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px}.row>.btn{flex:1}
.card .h2b{font:700 1.1rem var(--f-disp);text-transform:none;letter-spacing:0;color:var(--ink)}

</style>

  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}});return dbp}
function tx(st,mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction(st,mode),s=t.objectStore(st),out,r=fn(s);
  if(r)r.onsuccess=function(){out=r.result};t.oncomplete=function(){res(out)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error("abgebrochen"))}})})}

  if(!SET.name)h+='<div class="card"><h2>Wer macht die Rundgänge?</h2><label class="f">Dein Name<input type="text" id="setName" placeholder="Vorname Nachname"></label><button class="btn pri" data-act="nameOk">Speichern</button></div>';
  if(!R){h+='<button class="gross-aktion" data-act="neuRg">'+ICON.home+'<span><b>Neuen Rundgang starten</b><small>Gebäude auswählen und Stockwerk für Stockwerk kontrollieren</small></span></button>';
    var L=rgLetzter();if(L)h+='<p class="hint ctr">Letzter Rundgang: '+fDate(L.datum)+' · '+L.geb.length+' Gebäude'+(L.gesendet?' · Berichte gesendet':'')+'</p>'}
  else{var tot=0,done=0;R.geb.forEach(function(g){var gb=geb(g);if(!gb)return;gb.sto.forEach(function(s){tot++;if(R.begangen[key(g,s)])done++})});
    h+='<div class="card"><div class="rghead"><div><div class="eyebrow">Laufender Rundgang</div><h2 class="h2b">'+fDate(R.datum)+'</h2></div><div class="mono">'+done+' / '+tot+' Stockwerke</div></div><div class="progress"><div class="bar"><i style="width:'+(tot?Math.round(done/tot*100):0)+'%"></i></div></div></div>';
    h+='<div class="list">'+R.geb.map(function(g){var gb=geb(g);if(!gb)return "";var d=0;gb.sto.forEach(function(s){if(R.begangen[key(g,s)])d++});var o=offene(function(x){return x.geb===g}).length;
      return '<button class="item" data-go="geb" data-g="'+esc(g)+'"><div class="gnr">'+esc(g)+'</div><div class="t"><b>Gebäude '+esc(g)+'</b><span>'+d+' von '+gb.sto.length+' Stockwerken kontrolliert</span></div>'+(o?'<span class="dot gelb">'+o+'</span>':'')+(d===gb.sto.length?'<span class="okh">✓</span>':'')+'<span class="chev">›</span></button>'}).join("")+'</div>';
    h+='<button class="btn" data-act="gebDazu">+ Weiteres Gebäude in diesen Rundgang</button>';
    h+='<button class="btn pri big" data-go="rp">Rundgang abschliessen und Berichte senden ›</button>'}
  m.innerHTML=h}
function vGebWahl(m){var R=rgAktiv();head(R?"Gebäude hinzufügen":"Neuer Rundgang","Welche Gebäude kontrollierst du heute?",true);
  var sel=V.sel||[];var list=D.gebaeude.slice().sort(function(a,b){return natSort(a.nr,b.nr)});
  m.innerHTML='<div class="gebgrid">'+list.map(function(g){var on=sel.indexOf(g.nr)>=0,dis=R&&R.geb.indexOf(g.nr)>=0,o=offene(function(x){return x.geb===g.nr}).length;

   +'<button class="btn pri big" data-act="rgStart"'+(sel.length?"":" disabled")+'>'+(R?"Hinzufügen":"Rundgang starten")+(sel.length?' ('+sel.length+')':'')+'</button>'}
function vGeb(m){var R=rgAktiv(),g=V.g,gb=geb(g);if(!gb){go("home",{},true);return}head("Gebäude "+g,"Stockwerk antippen",true);
  var h='<div class="list">'+gb.sto.slice().sort(stoSort).map(function(s){var k=key(g,s),o=offene(function(x){return x.geb===g&&x.sto===s}).length,b=R&&R.begangen[k];
    return '<button class="item" data-go="sto" data-g="'+esc(g)+'" data-s="'+esc(s)+'"><div class="snr">'+esc(s)+'</div><div class="t"><b>'+esc(s)+'</b><span>'+(b?"kontrolliert "+fZeit(b).slice(11):"noch nicht kontrolliert")+'</span></div>'+(o?'<span class="dot gelb">'+o+'</span>':'')+(b?'<span class="okh">✓</span>':'')+'<span class="chev">›</span></button>'}).join("")+'</div>'

function mKarte(m,mitAktion){var p=punkt(m.code),R=rgAktiv(),ck=R&&R.checks[m.id];
  return '<div class="mg '+prioCls(m)+(ueberfaellig(m)?" ueber":"")+'"><div class="mgk"><span class="nr">'+mNr(m.nr)+'</span><span class="pill '+prioCls(m)+'">'+esc((PRIO[m.prio]||PRIO.m).l)+'</span>'+(ueberfaellig(m)?'<span class="pill ueb">überfällig</span>':'')+'</div>'
   +'<div class="mgb" data-go="mdet" data-id="'+m.id+'">'+((m.fotos||[]).length?'<div class="ph mini"><img data-ph="'+m.fotos[0]+'" alt=""></div>':'<div class="ph mini leer"></div>')
   +'<div class="t"><b>'+esc(mText(m))+'</b><span>'+esc(m.ort||"Standort offen")+' · erfasst '+fDate(m.erfasst)+'</span>'+(m.bem?'<span class="bem">'+esc(m.bem)+'</span>':'')+'</div></div>'
   +(mitAktion?'<div class="seg s2"><button data-act="ckVorh" data-id="'+m.id+'"'+(ck==="vorhanden"?' data-on="mangel"':'')+'>Noch vorhanden</button><button data-act="ckBeh" data-id="'+m.id+'"'+(ck==="behoben"?' data-on="ok"':'')+'>Behoben ✓</button></div>':'')+'</div>'}
function vSto(m){var R=rgAktiv(),g=V.g,s=V.s,k=key(g,s);head("Gebäude "+g+" · "+s,R?"Rundgang "+fDate(R.datum):"",true);
  var o=offene(function(x){return x.geb===g&&x.sto===s}).sort(function(a,b){return a.nr-b.nr});
  var beh=D.maengel.filter(function(x){return x.geb===g&&x.sto===s&&x.status==="behoben"&&R&&x.behobenRg===R.id});
  var h='<button class="gross-aktion rot" data-act="neuM">'+ICON.mg+'<span><b>Mangel erfassen</b><small>Standort, Mangel, Foto</small></span></button>';
  h+='<div class="sect">Offene Mängel auf diesem Stockwerk ('+o.length+')</div>';
  h+=o.length?o.map(function(x){return mKarte(x,!!R)}).join(""):'<p class="hint">Keine offenen Mängel.</p>';
  if(beh.length)h+='<div class="sect">Heute behoben ('+beh.length+')</div>'+beh.map(function(x){return '<div class="mg gruen"><div class="mgk"><span class="nr">'+mNr(x.nr)+'</span><span class="pill gruen">behoben</span></div><div class="mgb" data-go="mdet" data-id="'+x.id+'"><div class="t"><b>'+esc(mText(x))+'</b><span>'+esc(x.ort||"")+'</span></div></div></div>'}).join("");
  if(R){var offenUngeprueft=o.filter(function(x){return !R.checks[x.id]}).length;
    h+=R.begangen[k]?'<div class="banner ok">Stockwerk kontrolliert ('+fZeit(R.begangen[k]).slice(11)+')</div>':'';
    h+=offenUngeprueft?'<p class="hint">Bitte bei jedem offenen Mangel «Noch vorhanden» oder «Behoben» wählen.</p>':'';
    h+='<button class="btn ok big" data-act="stoFertig">'+(R.begangen[k]?"Weiter zum nächsten Stockwerk ›":"Stockwerk kontrolliert ✓ – weiter ›")+'</button>'}
  m.innerHTML=h}

/* ---------- Mangel erfassen / bearbeiten ---------- */
function vErf(m){var x=mById(V.id);if(!x){go("home",{},true);return}head(x.neu?"Mangel erfassen":"Mangel "+mNr(x.nr),"Gebäude "+x.geb+" · "+x.sto,true);
  var orte=orteVon(x.geb,x.sto),kat=V.kat||(punkt(x.code)||{}).k||"";
  var h='<div class="card"><h2>1. Wo genau?</h2><div class="chips">'+orte.map(function(o){return '<button class="chip'+(x.ort===o?" on":"")+'" data-act="ort" data-v="'+esc(o)+'">'+esc(o)+'</button>'}).join("")+'</div>'
   +'<label class="f">'+(orte.length?"Anderer Standort":"Standort")+'<input type="text" id="ortNeu" placeholder="z. B. Treppenhaus Ost" value="'+(orte.indexOf(x.ort)<0?esc(x.ort||""):"")+'"></label><p class="hint">Neue Standorte merkt sich die App für dieses Stockwerk.</p></div>';
  h+='<div class="card"><h2>2. Was ist nicht in Ordnung?</h2><div class="katgrid">'+KAT.map(function(k){return '<button class="katk'+(kat===k.k?" on":"")+'" data-act="kat" data-k="'+k.k+'">'+esc(k.n)+'</button>'}).join("")+'</div>';
  if(kat){h+='<div class="plist">'+PUNKTE.filter(function(p){return p.k===kat}).map(function(p){return '<div class="pp'+(x.code===p.c?" on":"")+'"><button class="pt" data-act="punkt" data-c="'+p.c+'"><span class="radio"></span><span>'+esc(p.t)+'</span></button>'
      +'<details class="info"><summary aria-label="Hilfe">ⓘ</summary><p>'+esc(p.h)+'</p>'+(p.s?'<p><b>Sofort:</b> '+esc(p.s)+'</p>':'')+(p.r?'<p class="ref">'+esc(p.r)+'</p>':'')+'</details></div>'}).join("")+'</div>'}
  h+='</div>';
  if(x.code){h+='<div class="card"><h2>3. Wie dringend?</h2><div class="seg s3">'+["s","m","n"].map(function(k){return '<button data-act="prio" data-v="'+k+'"'+(x.prio===k?' data-on="'+(k==="s"?"mangel":k==="m"?"warn":"ok")+'"':"")+'>'+PRIO[k].l+'</button>'}).join("")+'</div><p class="hint">Frist: '+(x.prio==="s"?"sofort":fDate(x.frist))+' (interne Frist DETEC)</p></div>'}
  h+='<div class="card"><h2>4. Fotos</h2><p class="hint">Ein Foto nah (Mangel) und eines weit (damit man die Stelle wiederfindet).</p><div class="photos">'+(x.fotos||[]).map(function(id){return '<div class="ph"><img data-ph="'+id+'" alt="Foto"><button data-act="phDel" data-id="'+id+'" aria-label="Foto löschen">×</button></div>'}).join("")+'</div>'
   +'<div class="row"><button class="btn" data-act="cam">📷 Foto aufnehmen</button><button class="btn" data-act="gal">Aus Galerie</button></div></div>';
  h+='<div class="card"><h2>5. Bemerkung (freiwillig)</h2><textarea id="bem" rows="3" placeholder="'+(x.code==="SO9"?"Bitte beschreiben, was nicht in Ordnung ist":"z. B. Mieter informiert")+'">'+esc(x.bem||"")+'</textarea>'
   +'<label class="check"><input type="checkbox" id="vorOrt"'+(x.vorOrt?" checked":"")+'> <span>Mangel wurde vor Ort sofort behoben</span></label></div>';
  h+='<button class="btn pri big" data-act="erfFertig">'+(x.neu?"Mangel speichern":"Fertig")+'</button>';
  if(x.neu)h+='<button class="btn warn" data-act="erfAbbr">Abbrechen</button>';
  if(x.alt)h+='<p class="hint">Aus alter App übernommen: «'+esc(x.alt)+'»</p>';
  m.innerHTML=h;
  var on=$("#ortNeu");on.addEventListener("change",function(){var v=on.value.trim();if(v){x.ort=v;save()}});
  $("#bem").addEventListener("input",function(){x.bem=this.value;save()});
  $("#vorOrt").addEventListener("change",function(){x.vorOrt=this.checked;save()})}
function neuerMangel(g,s){var R=rgAktiv(),x={id:uid(),nr:0,geb:g,sto:s,ort:"",code:"",prio:"m",frist:addDays(todayIso(),14),bem:"",fotos:[],fotosNach:[],status:"entwurf",erfasst:new Date().toISOString(),von:SET.name||"",rg:R?R.id:"",neu:true};
  D.maengel.push(x);save();return x}
function erfFertig(x){var on=$("#ortNeu");if(on&&on.value.trim())x.ort=on.value.trim();
  if(!x.ort){toast("Bitte zuerst den Standort wählen oder eintippen");return}
  if(!x.code){toast("Bitte auswählen, was nicht in Ordnung ist");return}
  if(x.code==="SO9"&&!String(x.bem||"").trim()){toast("Bitte in der Bemerkung beschreiben, was nicht in Ordnung ist");return}
  if(!(x.fotos||[]).length&&!confirm("Noch kein Foto. Trotzdem speichern?"))return;
  lerneOrt(x.geb,x.sto,x.ort);
  if(x.neu){x.nr=D.seq++;delete x.neu;x.status="offen";var R=rgAktiv();if(R){x.rg=R.id;R.checks[x.id]="vorhanden"}}
  if(x.vorOrt&&x.status==="offen"){x.status="behoben";x.behobenAm=new Date().toISOString();x.behobenVon=SET.name||"";x.behobenBem="vor Ort behoben";var R2=rgAktiv();x.behobenRg=R2?R2.id:"";if(R2)R2.checks[x.id]="behoben"}
  save();toast(mNr(x.nr)+" gespeichert");history.back()}

  list.sort(function(a,b){return natSort(a.geb,b.geb)||stoSort(a.sto,b.sto)||a.nr-b.nr});
  var gebs=D.gebaeude.map(function(x){return x.nr}).sort(natSort);

   +'<select id="mfg"><option value="">Alle Gebäude</option>'+gebs.map(function(x){var n=offene(function(y){return y.geb===x}).length;return '<option value="'+esc(x)+'"'+(g===x?" selected":"")+'>Gebäude '+esc(x)+' ('+n+')</option>'}).join("")+'</select>';

/* ---------- Berichte ---------- */
function vBerichte(m){var R=rgAktiv()||rgLetzter();head("Berichte","Pro Gebäude ein PDF + Übersicht",false);
  if(!R){m.innerHTML='<p class="hint ctr">Noch kein Rundgang. Starte zuerst einen Rundgang.</p>';return}

   +'<table class="kz"><tr><th>Gebäude</th><th>Stw.</th><th>Neu</th><th>Offen</th><th>Behoben</th></tr>'+R.geb.map(function(g){var gb=geb(g)||{sto:[]},d=gb.sto.filter(function(s){return R.begangen[key(g,s)]}).length;
     var neu=D.maengel.filter(function(x){return x.geb===g&&x.rg===R.id&&x.status!=="entwurf"}).length,off=offene(function(x){return x.geb===g}).length,beh=D.maengel.filter(function(x){return x.geb===g&&x.behobenRg===R.id}).length;
     return '<tr><td><b>'+esc(g)+'</b></td><td class="mono">'+d+'/'+gb.sto.length+'</td><td class="mono">'+neu+'</td><td class="mono">'+off+'</td><td class="mono">'+beh+'</td></tr>'}).join("")+'</table>';

  h+='<div class="card"><h2>Einzelbericht für ein Gebäude</h2><p class="hint">Aktueller Stand eines Gebäudes, auch ohne Rundgang (z. B. für den Kunden).</p><select id="egeb">'+D.gebaeude.map(function(x){return x.nr}).sort(natSort).map(function(x){return '<option>'+esc(x)+'</option>'}).join("")+'</select><button class="btn" data-act="pdfEinzel">PDF erstellen</button></div>';
  m.innerHTML=h}

function blobB64(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(String(f.result).split(",")[1])};f.onerror=rej;f.readAsDataURL(b)})}
function an(adr){return String(adr||"").split(/[,;\s]+/).filter(Boolean).map(function(a){return {emailAddress:{address:a}}})}
/* Mail mit PDF-Anhängen nur über /me/sendMail (braucht nur das Recht Mail.Send).
   Graph nimmt pro Anfrage max. 4 MB an: PDFs werden deshalb auf mehrere Mails verteilt (je max. ca. 2.8 MB Anhang). */
var MAX_TEIL=2800000;
function mailMitPdfs(betreff,html,empf,pdfs){return Promise.all(pdfs.map(function(f){return blobB64(f.blob).then(function(b){return {name:f.name,b:b,n:b.length}})})).then(function(liste){
  var teile=[],akt=[],sum=0;liste.forEach(function(x){if(x.n>3600000)throw new Error("PDF "+x.name+" ist zu gross für den Mailversand ("+Math.round(x.n*3/4/1048576*10)/10+" MB). Bitte weniger Fotos pro Gebäude.");
    if(akt.length&&sum+x.n>MAX_TEIL){teile.push(akt);akt=[];sum=0}akt.push(x);sum+=x.n});if(akt.length)teile.push(akt);
  var p=Promise.resolve();teile.forEach(function(t,i){p=p.then(function(){
    return graph("POST","/me/sendMail",{message:{subject:betreff+(teile.length>1?" (Teil "+(i+1)+"/"+teile.length+")":""),body:{contentType:"HTML",content:html},toRecipients:an(empf),
      attachments:t.map(function(x){return {"@odata.type":"#microsoft.graph.fileAttachment",name:x.name,contentType:"application/pdf",contentBytes:x.b}})},saveToSentItems:true})})});
  return p})}
function mailHtml(betreff,html,empf){return graph("POST","/me/sendMail",{message:{subject:betreff,body:{contentType:"HTML",content:html},toRecipients:an(empf)},saveToSentItems:true})}

    b:beh.map(function(x){return [x.nr,x.geb,x.sto,x.ort||"",mText(x),x.behobenBem||""]})};
  var cs=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("deflate-raw"));

   +gebs.map(function(g){var o=alle.filter(function(x){return x.geb===g}),lk=letzteKontrolle(g),u=o.filter(ueberfaellig).length;return '<tr><td '+td+'><b>'+esc(g)+'</b></td><td '+td+'>'+(lk?fDate(lk):"–")+'</td><td '+td+'>'+o.length+'</td><td '+td+'>'+o.filter(function(x){return x.prio==="s"}).length+'</td><td '+td+'>'+(u?'<b style="color:#b3122c">'+u+'</b>':"0")+'</td></tr>'}).join("")+'</table>'
   +'<b style="color:#0b6e77">Alle offenen Mängel</b><table cellspacing="0" style="border-collapse:collapse;width:100%;margin:6px 0 16px"><tr><th '+th+'>Nr.</th><th '+th+'>Geb.</th><th '+th+'>Stw.</th><th '+th+'>Standort</th><th '+th+'>Feststellung</th><th '+th+'>Priorität</th><th '+th+'>Frist</th></tr>'
   +(alle.length?alle.map(function(x){return '<tr><td '+td+'>'+mNr(x.nr)+'</td><td '+td+'>'+esc(x.geb)+'</td><td '+td+'>'+esc(x.sto)+'</td><td '+td+'>'+esc(x.ort||"–")+'</td><td '+td+'>'+esc(mText(x))+(x.bem?'<br><i style="color:#56687a">'+esc(x.bem)+'</i>':'')+'</td><td '+td+'><b style="color:'+farbe[x.prio]+'">'+(PRIO[x.prio]||PRIO.m).l+'</b></td><td '+td+'>'+(ueberfaellig(x)?'<b style="color:#b3122c">'+fristLang(x)+'</b>':fristLang(x))+'</td></tr>'}).join(""):'<tr><td '+td+' colspan="7">Keine offenen Mängel.</td></tr>')+'</table>';

/* ---------- Senden (mit Warteschlange ohne Netz) ---------- */
function versandStarten(rgId){var R=rgById(rgId);
  if(!SET.nina||!SET.pdfAn){toast("Bitte unter «Mehr» die Empfänger eintragen",4000);go("me");return}
  if(!navigator.onLine){D.versandOffen=rgId||"-";save();toast("Kein Netz – die Berichte werden automatisch gesendet, sobald du wieder Empfang hast",5000);render();return}
  if(!msBereit()){toast("Microsoft-Versand noch nicht eingerichtet",4000);return}
  var ov=$("#busy");ov.hidden=false;ov.querySelector("span").textContent="Wird gesendet …";
  var titel="Brandschutz-Rundgang "+(SET.areal||"")+" "+fDate(R?R.datum:todayIso());
  var p=PDFS.length?Promise.resolve():neuErstellen(R);
  p.then(function(){ov.querySelector("span").textContent="Mail an "+SET.nina+" …";return uebersichtLink(R).then(function(l){return mailHtml(titel+" – offene Mängel",htmlUebersicht(R,l),SET.nina)})})
   .then(function(){ov.querySelector("span").textContent="PDFs an "+SET.pdfAn+" …";return mailMitPdfs(titel+" – Berichte pro Gebäude",htmlPdfMail(R),SET.pdfAn,PDFS)})
   .then(function(){ov.hidden=true;if(R){R.gesendet=Date.now()}delete D.versandOffen;save();render();toast("Gesendet an "+SET.nina+" und "+SET.pdfAn,4000)})
   .catch(function(e){ov.hidden=true;if(e&&e.login){D.versandOffen=rgId||"-";save();msLogin("senden");return}
     if(!navigator.onLine||/fetch/i.test(String(e&&e.message))){D.versandOffen=rgId||"-";save();toast("Keine Verbindung – wird später automatisch gesendet",5000);render();return}
     errBanner("Senden fehlgeschlagen: "+(e&&e.message||e))})}
function neuErstellen(R){var gebs=R?R.geb:[];var out=[],p=Promise.resolve();gebs.forEach(function(g){p=p.then(function(){return pdfGebaeude(R,g)}).then(function(f){out.push(f)})});
  return p.then(function(){PDFS=out.map(function(f){return {name:f.name,size:f.blob.size,blob:f.blob,file:new File([f.blob],f.name,{type:"application/pdf"})}})})}
function warteschlange(){if(!D||!D.versandOffen||!navigator.onLine||!msBereit())return;msGueltig().then(function(t){if(!t){errBanner("Berichte warten auf den Versand – bitte unter «Berichte» auf «Jetzt senden» tippen und anmelden.");return}
  var id=D.versandOffen==="-"?"":D.versandOffen;PDFS=[];versandStarten(id)})}
